# Publishes the site to Cloudflare Pages (https://jaxenlabs.pages.dev) and,
# from main, to GitHub Pages (https://jaxenlabs.github.io).
#
# Work happens on the develop branch: every push to develop is built, checked
# and published as a preview (https://develop.jaxenlabs.pages.dev).
# Merging develop into main and pushing main publishes the live site.
#
# GitHub Pages stays the main address because JaxBudget's home page, privacy
# policy and terms URLs on jaxenlabs.github.io are registered in Google Cloud.
#
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a Cloudflare API token
# with Account > Cloudflare Pages > Edit) and CLOUDFLARE_ACCOUNT_ID.
# GitHub Pages: repo Settings > Pages > Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PROJECT: jaxenlabs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=${{ env.CLOUDFLARE_PROJECT }} --branch=${{ github.ref_name }} --commit-dirty=true
      - if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  github-pages:
    if: github.ref_name == 'main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
